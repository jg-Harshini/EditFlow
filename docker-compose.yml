version: '3.8'

services:
  incubrix-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: incubrix-engine
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=IncuBrix Prompt-Based Video Editing Engine
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=false
      - LOG_LEVEL=INFO
      - S3_ENABLED=true
      - S3_ENDPOINT=minio:9000
      - S3_BUCKET=incubrix-videos
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_USE_SSL=false
      - STT_PROVIDER=mock
    volumes:
      - ./storage_data:/app/storage_data
      - ./outputs:/app/outputs
      - ./temp_data:/app/temp_data
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: incubrix-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  minio_data:
